name: naver-flight-watch

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 (UTC 기준, GitHub이 최대 수십 분 지연 가능)
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write             # state.json 커밋용

concurrency:
  group: naver-flight-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check flights
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 감시 대상: "출발:날짜" 또는 "출발:날짜:시작-끝(HHMM 시간대)"
          TARGETS: "GMP:20260924,ICN:20260924,GMP:20260923:1700-2359,ICN:20260923:1700-2359"
          ARR: "CJU"
          ADULT: "1"
        run: python check_flights.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "flight-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "state unchanged"
          fi
